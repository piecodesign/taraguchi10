<script>

  ja:{guide:"五珠指南書",title:"珠型クイズ　上級",beginner:"入門",advanced:"上級",random:"ランダム出題",byShape:"珠型別出題",selectShape:"珠型を選択",candidate:n=>`5手目の候補手<span class="counter">${n}</span>個`,hint:"右上の数だけ5手目の候補手を選び、送信してください。同じ交点をもう一度選ぶと取り消せます。",symmetryError:"対称形には置くことができません",correct:"正解",loading:"珠型データを読み込んでいます…",loadError:"珠型データを読み込めませんでした。ローカルサーバー経由で開いてください。",settings:"設定",board:"盤",stone:"石",light:"ライト",dark:"ダーク",close:"閉じる",previous:"前の問題",answer:"回答する",skip:"スキップ",retry:"もう一度解く",next:"次の問題",quiz:"珠型クイズ",favorites:"my珠型",direct:"直接打ち",indirect:"間接打ち",search:"手順検索"},

};
const BOARD_OPTIONS=[
  {key:"wood",ja:"木目",en:"Wood",bg:"#e6c98d",line:"rgba(88,54,22,.38)",star:"#71502b",label:"rgba(88,54,22,.52)"},
  {key:"paper",ja:"和紙",en:"Paper",bg:"#dacba8",line:"rgba(65,55,39,.43)",star:"#62543c",label:"rgba(65,55,39,.56)"}
];

const LANG_KEY="josekiLab:lang",THEME_KEY="josekiLab:theme",SETTINGS_KEY="taraguchiCodex:boardSettings:v1";
let lang=localStorage.getItem(LANG_KEY)||"ja",theme=localStorage.getItem(THEME_KEY)||"light",settings={board:"wood",stone:"3d"};
try{const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");const savedBoard=saved.boardColor||saved.board,savedStone=saved.stoneStyle||saved.stone;if(BOARD_OPTIONS.some(o=>o.key===savedBoard))settings.board=savedBoard;if(STONE_OPTIONS.some(o=>o.key===savedStone))settings.stone=savedStone}catch(e){}
const SIZE=700,STAR_POINTS=[[3,3],[3,11],[7,7],[11,3],[11,11]];
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d"),answerButton=document.getElementById("answerButton"),postActions=document.getElementById("postActions"),overlay=document.getElementById("resultOverlay"),placementError=document.getElementById("placementError");
let shapes=[],questions=[],current=null,placed=[],answered=false,judgedCandidates=null,mode="random",lastQuestionKey="",questionHistory=[],historyIndex=-1,geo={};
let placementErrorTimer=null;
function t(key){return I18N[lang][key]}
function questionKey(q){return `${q.shape.id}:${q.variation.id}`}
function openingCode(shape){const n=String(shape.no||"").match(/\d+/)?.[0]||"";return `${shape.category==="indirect"?"I":"D"}${n}`}
function romanizedName(shape){const value=String(shape.id||shape.name);return value.charAt(0).toUpperCase()+value.slice(1)}
function displayName(shape){return lang==="en"?romanizedName(shape):shape.name}

function boardOption(){return BOARD_OPTIONS.find(o=>o.key===settings.board)||BOARD_OPTIONS[0]}
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestions(shapeList){return shapeList.flatMap(shape=>(shape.variations||[]).filter(v=>Array.isArray(v.moves)&&v.moves.some(m=>m.n===4)&&Array.isArray(v.branches)).flatMap(variation=>{const baseMoves=[...(variation.baseMoves||shape.baseMoves),...variation.moves],seen=new Set,candidates=variation.branches.filter(branch=>!String(branch.label||"").trim().toUpperCase().startsWith("C")).map(({x,y})=>({x,y})).filter(candidate=>{const key=stoneShapeKey([...baseMoves,{...candidate,color:"black"}]);if(seen.has(key))return false;seen.add(key);return true});return candidates.length?[{shape,variation,candidates}]:[]}))}
function computeGeo(){const margin=(innerWidth<=768?24:40)*(SIZE/700),step=(SIZE-margin*2)/14;geo={margin,step,originX:margin,originY:SIZE-margin,stoneR:step*.46}}
function point(x,y){return{x:geo.originX+x*geo.step,y:geo.originY-y*geo.step}}
function drawBase(){const b=boardOption(),x0=geo.originX,x1=x0+14*geo.step,y0=geo.originY,y1=y0-14*geo.step;ctx.fillStyle=document.body.classList.contains("theme-dark")?"#302d27":"#fbf8ef";ctx.fillRect(0,0,SIZE,SIZE);ctx.fillStyle=b.bg;ctx.fillRect(x0,y1,x1-x0,y0-y1);ctx.save();ctx.beginPath();ctx.rect(x0,y1,x1-x0,y0-y1);ctx.clip();if(b.key==="wood"){ctx.strokeStyle="rgba(104,61,21,.045)";ctx.lineWidth=1;for(let x=7;x<SIZE;x+=13){ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+3,SIZE*.32,x-2,SIZE*.68,x+1,SIZE);ctx.stroke()}}else{const shade=ctx.createRadialGradient(SIZE*.48,SIZE*.44,SIZE*.08,SIZE*.5,SIZE*.5,SIZE*.72);shade.addColorStop(0,"rgba(255,255,255,.055)");shade.addColorStop(1,"rgba(82,64,31,.055)");ctx.fillStyle=shade;ctx.fillRect(0,0,SIZE,SIZE)}ctx.restore();ctx.strokeStyle=b.line;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<15;i++){let a=point(i,0),z=point(i,14);ctx.moveTo(a.x,a.y);ctx.lineTo(z.x,z.y);a=point(0,i);z=point(14,i);ctx.moveTo(a.x,a.y);ctx.lineTo(z.x,z.y)}ctx.stroke();ctx.fillStyle=b.star;STAR_POINTS.forEach(([x,y])=>{const p=point(x,y);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,geo.step*.07),0,Math.PI*2);ctx.fill()});ctx.fillStyle=b.label;ctx.font=`${Math.round(geo.step*.32)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";"ABCDEFGHIJKLMNO".split("").forEach((c,i)=>ctx.fillText(c,geo.originX+i*geo.step,y0+geo.margin*.22));ctx.textAlign="right";ctx.textBaseline="middle";for(let i=0;i<15;i++)ctx.fillText(String(i+1),x0-geo.margin*.28,geo.originY-i*geo.step)}
function stoneFill(p,r,isBlack){if(settings.stone==="flat")return isBlack?"#20201e":"#fff";const g=ctx.createRadialGradient(p.x-r*.36,p.y-r*.42,r*.06,p.x,p.y,r*1.04);if(isBlack){g.addColorStop(0,"#4e4941");g.addColorStop(.35,"#312e29");g.addColorStop(.75,"#201d19");g.addColorStop(1,"#14110d")}else{g.addColorStop(0,"#fff");g.addColorStop(.45,"#faf6ec");g.addColorStop(.85,"#eee4d0");g.addColorStop(1,"#dccfb6")}return g}
function drawStone(move){const p=point(move.x,move.y),r=geo.stoneR,isBlack=move.color==="black";ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=stoneFill(p,r,isBlack);if(settings.stone==="flat"){ctx.fill();ctx.strokeStyle="#333";ctx.lineWidth=1;ctx.stroke()}else{ctx.save();ctx.shadowColor="rgba(38,24,10,.32)";ctx.shadowBlur=r*.45*(devicePixelRatio||1);ctx.shadowOffsetY=r*.16*(devicePixelRatio||1);ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(p.x,p.y,r-.25,0,Math.PI*2);ctx.strokeStyle=isBlack?"rgba(0,0,0,.2)":"rgba(74,54,34,.28)";ctx.lineWidth=Math.max(.5,r*.03);ctx.stroke()}ctx.fillStyle=isBlack?"rgba(255,255,255,.92)":"rgba(30,30,28,.85)";ctx.font=`600 ${Math.round(r*.82)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(move.n,p.x,p.y+r*.05)}
function transformPoint(move,k){const dx=move.x-7,dy=move.y-7;let tx,ty;switch(k){case 0:[tx,ty]=[dx,dy];break;case 1:[tx,ty]=[-dy,dx];break;case 2:[tx,ty]=[-dx,-dy];break;case 3:[tx,ty]=[dy,-dx];break;case 4:[tx,ty]=[-dx,dy];break;case 5:[tx,ty]=[dx,-dy];break;case 6:[tx,ty]=[dy,dx];break;default:[tx,ty]=[-dy,-dx]}return{...move,x:7+tx,y:7+ty}}
// 盤端からの距離や着手番号は使わず、石の色と図形だけで5手図を正規化する。
// これにより、平行移動・回転・鏡映で一致する候補手を重複して選べなくする。
function stoneShapeKey(stones){return Array.from({length:8},(_,k)=>{const transformed=stones.map(stone=>transformPoint(stone,k)),minX=Math.min(...transformed.map(stone=>stone.x)),minY=Math.min(...transformed.map(stone=>stone.y));return transformed.map(stone=>`${stone.color}:${stone.x-minX},${stone.y-minY}`).sort().join("|")}).sort()[0]}
function candidateShapeKey(candidate){return stoneShapeKey([...positionMoves().map(({x,y,color})=>({x,y,color})),{...candidate,color:"black"}])}
function isDuplicateCandidate(candidate){const key=candidateShapeKey(candidate);return placed.some(selected=>candidateShapeKey(selected)===key)}
function hidePlacementError(){clearTimeout(placementErrorTimer);placementError.hidden=true}
function showPlacementError(){clearTimeout(placementErrorTimer);placementError.textContent=t("symmetryError");placementError.hidden=false;placementErrorTimer=setTimeout(()=>{placementError.hidden=true},2200)}
function bestCandidateVariant(){const answers=new Set(placed.map(candidateShapeKey));return{points:current.candidates,score:current.candidates.filter(candidate=>answers.has(candidateShapeKey(candidate))).length}}
function isCandidate(move){const key=candidateShapeKey(move);return (judgedCandidates||current.candidates).some(candidate=>candidateShapeKey(candidate)===key)}
function drawAnswerStone(move,index){const p=point(move.x,move.y),r=geo.stoneR*.78,correct=answered&&isCandidate(move);ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=correct?"rgba(214,95,69,.95)":"rgba(47,111,82,.94)";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#fff";ctx.font=`700 ${Math.round(r*.82)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(index+1),p.x,p.y)}
function drawCorrectMarker(move){const key=candidateShapeKey(move);if(placed.some(candidate=>candidateShapeKey(candidate)===key))return;const p=point(move.x,move.y),r=geo.stoneR*.36;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle="rgba(177,63,52,.76)";ctx.fill()}
function positionMoves(){return [...(current.variation.baseMoves||current.shape.baseMoves),...current.variation.moves]}
function drawBoard(){if(!current)return;computeGeo();drawBase();positionMoves().sort((a,b)=>a.n-b.n).forEach(drawStone);placed.forEach(drawAnswerStone);if(answered)(judgedCandidates||current.candidates).forEach(drawCorrectMarker)}
function updateInstruction(){const total=current.candidates.length;document.getElementById("instruction").innerHTML=t("candidate")(total);answerButton.disabled=answered||placed.length!==total}
function showQuestion(picked,record){if(record){questionHistory=questionHistory.slice(0,historyIndex+1);questionHistory.push(picked);historyIndex=questionHistory.length-1}current=picked;lastQuestionKey=questionKey(picked);resetAnswer();document.getElementById("shapeName").textContent=`${openingCode(picked.shape)} ${displayName(picked.shape)}`;document.getElementById("variationName").textContent=`Figure ${picked.variation.id.replace(/^v/,"")}`;drawBoard()}
function chooseQuestion(){const pool=mode==="shape"?questions.filter(q=>q.shape.id===document.getElementById("shapeSelect").value):questions;const alternatives=pool.filter(q=>questionKey(q)!==lastQuestionKey),picked=shuffled(alternatives.length?alternatives:pool)[0];if(picked)showQuestion(picked,true)}
function previousQuestion(){if(historyIndex<=0)return;historyIndex--;showQuestion(questionHistory[historyIndex],false)}
function resetAnswer(){placed=[];answered=false;judgedCandidates=null;hidePlacementError();overlay.hidden=true;answerButton.hidden=false;document.getElementById("skipButton").hidden=false;postActions.hidden=true;document.getElementById("resultStamp").hidden=true;document.getElementById("instruction").hidden=false;document.getElementById("previousButton").hidden=historyIndex<=0;if(current)updateInstruction();drawBoard()}
function submit(){if(answerButton.disabled)return;answered=true;const best=bestCandidateVariant(),correctCount=best.score,total=current.candidates.length,perfect=correctCount===total;judgedCandidates=best.points;document.getElementById("resultScore").innerHTML=`<span class="result-label">${t("correct")}</span> <span class="result-counter">${correctCount}/${total}</span>`;document.getElementById("resultStamp").hidden=!perfect;document.getElementById("instruction").hidden=true;overlay.hidden=false;answerButton.hidden=true;document.getElementById("skipButton").hidden=true;postActions.hidden=false;document.getElementById("previousButton").hidden=historyIndex<=0;updateInstruction();drawBoard()}
function setMode(next){mode=next;questionHistory=[];historyIndex=-1;lastQuestionKey="";document.getElementById("randomMode").classList.toggle("active",mode==="random");document.getElementById("shapeMode").classList.toggle("active",mode==="shape");document.getElementById("shapePicker").hidden=mode!=="shape";chooseQuestion()}
function setLabel(id,label){const el=document.getElementById(id);el.setAttribute("aria-label",label);el.setAttribute("title",label)}
function buildShapeSelect(){const select=document.getElementById("shapeSelect"),value=select.value;select.innerHTML="";shapes.filter(s=>questions.some(q=>q.shape===s)).forEach(s=>select.add(new Option(`${openingCode(s)} ${displayName(s)}`,s.id)));if([...select.options].some(o=>o.value===value))select.value=value;select.setAttribute("aria-label",t("selectShape"))}
function applyLanguage(){document.documentElement.lang=lang;document.title=`${t("title")}｜Taraguchi-10`;document.getElementById("brandGuide").textContent=t("guide");document.getElementById("quizTitle").textContent=t("title");document.getElementById("beginnerLevel").textContent=t("beginner");document.getElementById("advancedLevel").textContent=t("advanced");document.getElementById("levelSwitch").setAttribute("aria-label",lang==="ja"?"難易度":"Difficulty");document.querySelector(".mode-switch").setAttribute("aria-label",lang==="ja"?"出題モード":"Question mode");document.getElementById("randomMode").textContent=t("random");document.getElementById("shapeMode").textContent=t("byShape");document.getElementById("answerHint").textContent=t("hint");setLabel("quizNav",t("quiz"));setLabel("favoritesNav",t("favorites"));setLabel("directNav",t("direct"));setLabel("indirectNav",t("indirect"));setLabel("searchNav",t("search"));setLabel("settingsButton",t("settings"));setLabel("previousButton",t("previous"));setLabel("answerButton",t("answer"));setLabel("skipButton",t("skip"));setLabel("retryButton",t("retry"));setLabel("nextButton",t("next"));document.getElementById("loading").textContent=t("loading");if(shapes.length)buildShapeSelect();if(current){document.getElementById("shapeName").textContent=`${openingCode(current.shape)} ${displayName(current.shape)}`;updateInstruction();if(answered){const total=current.candidates.length,correctCount=bestCandidateVariant().score;document.getElementById("resultScore").innerHTML=`<span class="result-label">${t("correct")}</span> <span class="result-counter">${correctCount}/${total}</span>`}}}
function applyTheme(){document.body.classList.toggle("theme-dark",theme==="dark");if(current)drawBoard()}
const settingsBackdrop=document.getElementById("settingsBackdrop"),settingsModal=document.getElementById("settingsModal");
function closeSettings(){settingsBackdrop.hidden=true}
function renderSettings(){const b=boardOption(),s=STONE_OPTIONS.find(o=>o.key===settings.stone),languageLabel=lang==="ja"?"日本語":"English",themeLabel=theme==="dark"?t("dark"):t("light");settingsModal.innerHTML=`<h2 id="settingsTitle">${t("settings")}</h2><div class="settings-pill-row"><button class="settings-pill" id="cycleLanguage" type="button"><i class="ti ti-language" aria-hidden="true"></i>${languageLabel}</button><button class="settings-pill" id="cycleTheme" type="button"><i class="ti ${theme==="dark"?"ti-moon":"ti-sun"}" aria-hidden="true"></i>${themeLabel}</button><button class="settings-pill" id="cycleBoard" type="button"><i class="ti ti-grid-dots" aria-hidden="true"></i>${t("board")} ${lang==="ja"?b.ja:b.en}</button><button class="settings-pill" id="cycleStone" type="button"><i class="ti ti-circle-filled" aria-hidden="true"></i>${t("stone")} ${lang==="ja"?s.ja:s.en}</button></div><div class="modal-close-row"><button id="closeSettings" type="button" aria-label="${t("close")}">×</button></div>`;document.getElementById("cycleLanguage").onclick=()=>{lang=lang==="ja"?"en":"ja";saveSettings();applyLanguage();renderSettings()};document.getElementById("cycleTheme").onclick=()=>{theme=theme==="dark"?"light":"dark";saveSettings();applyTheme();renderSettings()};document.getElementById("cycleBoard").onclick=()=>{const i=BOARD_OPTIONS.findIndex(o=>o.key===settings.board);settings.board=BOARD_OPTIONS[(i+1)%BOARD_OPTIONS.length].key;saveSettings();drawBoard();renderSettings()};document.getElementById("cycleStone").onclick=()=>{const i=STONE_OPTIONS.findIndex(o=>o.key===settings.stone);settings.stone=STONE_OPTIONS[(i+1)%STONE_OPTIONS.length].key;saveSettings();drawBoard();renderSettings()};document.getElementById("closeSettings").onclick=closeSettings}
canvas.addEventListener("click",e=>{if(answered||!current)return;const rect=canvas.getBoundingClientRect(),px=(e.clientX-rect.left)*SIZE/rect.width,py=(e.clientY-rect.top)*SIZE/rect.height,x=Math.round((px-geo.originX)/geo.step),y=Math.round((geo.originY-py)/geo.step);if(x<0||x>14||y<0||y>14)return;const occupied=positionMoves().some(m=>m.x===x&&m.y===y);if(occupied)return;const index=placed.findIndex(m=>m.x===x&&m.y===y);if(index>=0){hidePlacementError();placed.splice(index,1)}else if(isDuplicateCandidate({x,y}))showPlacementError();else if(placed.length<current.candidates.length){hidePlacementError();placed.push({x,y})}updateInstruction();drawBoard()});
answerButton.addEventListener("click",submit);document.getElementById("skipButton").addEventListener("click",chooseQuestion);document.getElementById("nextButton").addEventListener("click",chooseQuestion);document.getElementById("previousButton").addEventListener("click",previousQuestion);document.getElementById("retryButton").addEventListener("click",resetAnswer);document.getElementById("randomMode").addEventListener("click",()=>setMode("random"));document.getElementById("shapeMode").addEventListener("click",()=>setMode("shape"));document.getElementById("shapeSelect").addEventListener("change",()=>{questionHistory=[];historyIndex=-1;lastQuestionKey="";chooseQuestion()});document.getElementById("resultStamp").addEventListener("error",event=>{event.currentTarget.hidden=true});document.getElementById("settingsButton").addEventListener("click",()=>{renderSettings();settingsBackdrop.hidden=false});settingsBackdrop.addEventListener("click",event=>{if(event.target===settingsBackdrop)closeSettings()});window.addEventListener("resize",drawBoard);
applyLanguage();applyTheme();
Promise.all(DATA_FILES.map(async file=>{const response=await fetch(file,{cache:"no-cache"});if(!response.ok)throw new Error(`${file}: ${response.status}`);return response.json()})).then(data=>{shapes=data.filter(s=>Array.isArray(s.variations));questions=makeQuestions(shapes);if(!questions.length)throw new Error("No questions");buildShapeSelect();document.getElementById("loading").hidden=true;document.getElementById("quiz").hidden=false;chooseQuestion()}).catch(error=>{const el=document.getElementById("loading");el.className="status error";el.textContent=t("loadError");console.error(error)});
</script>
</body>
