<div class="modal-backdrop" id="settingsBackdrop" hidden>

<script>
const DATA_FILES=[
  "data/direct/d1_kansei.json","data/direct/d2_keigetsu.json","data/direct/d3_sosei.json","data/direct/d4_kagetsu.json","data/direct/d5_zangetsu.json","data/direct/d6_ugetsu.json","data/direct/d7_kinsei.json","data/direct/d8_shogetsu.json","data/direct/d9_kyugetsu.json","data/direct/d10_shingetsu.json","data/direct/d11_zuisei.json","data/direct/d12_sangetsu.json","data/direct/d13_yusei.json",
  "data/indirect/i1_chosei.json","data/indirect/i2_kyogetsu.json","data/indirect/i3_kosei.json","data/indirect/i4_suigetsu.json","data/indirect/i5_ryusei.json","data/indirect/i6_ungetsu.json","data/indirect/i7_hogetsu.json","data/indirect/i8_rangetsu.json","data/indirect/i9_gingetsu.json","data/indirect/i10_myojo.json","data/indirect/i11_shagetsu.json","data/indirect/i12_meigetsu.json","data/indirect/i13_suisei.json"
];
const I18N={
  ja:{guide:"五珠指南書",title:"珠型クイズ",beginner:"入門",advanced:"上級",shapeMode:"形を当てる",nameMode:"名前を当てる",lead:"表示された名前の珠型を作りましょう。白2、黒3の順に置いてください。",nameLead:"盤面の珠型名を選びましょう。",white2:"白2",black3:"黒3",question:n=>`第${n}問 / 10`,loading:"珠型データを読み込んでいます…",loadError:"珠型データを読み込めませんでした。ローカルサーバー経由で開いてください。",settings:"設定",board:"盤",stone:"石",theme:"表示",light:"ライト",dark:"ダーク",close:"閉じる",undo:"一手戻す",next:"次の問題",again:"もう一度あそぶ",correct:"正解",incorrect:"不正解",quiz:"珠型クイズ",favorites:"my珠型",direct:"直接打ち",indirect:"間接打ち",search:"手順検索"},
  en:{guide:"Opening Guide",title:"Opening Quiz",beginner:"Beginner",advanced:"Advanced",shapeMode:"Match the Shape",nameMode:"Match the Name",lead:"Create the opening shown above. Place White 2, then Black 3.",nameLead:"Choose the name of the opening shown on the board.",white2:"White 2",black3:"Black 3",question:n=>`Question ${n} / 10`,loading:"Loading opening data…",loadError:"Opening data could not be loaded. Please open this page through a local server.",settings:"Settings",board:"Board",stone:"Stone",theme:"Theme",light:"Light",dark:"Dark",close:"Close",undo:"Undo",next:"Next",again:"Play Again",correct:"Correct",incorrect:"Incorrect",quiz:"Opening Quiz",favorites:"My Openings",direct:"Direct",indirect:"Indirect",search:"Search"}
};
const BOARD_OPTIONS=[
  {key:"wood",ja:"木目",en:"Wood",bg:"#e6c98d",line:"rgba(88,54,22,.38)",star:"#71502b",label:"rgba(88,54,22,.52)"},
  {key:"paper",ja:"和紙",en:"Paper",bg:"#dacba8",line:"rgba(65,55,39,.43)",star:"#62543c",label:"rgba(65,55,39,.56)"}
];
const STONE_OPTIONS=[{key:"3d",ja:"立体",en:"3D"},{key:"flat",ja:"シンプル",en:"Simple"}];
const LANG_KEY="josekiLab:lang",THEME_KEY="josekiLab:theme",SETTINGS_KEY="taraguchiCodex:boardSettings:v1";
let lang=localStorage.getItem(LANG_KEY)||"ja",theme=localStorage.getItem(THEME_KEY)||"light",settings={board:"wood",stone:"3d"};
try{const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");const savedBoard=saved.boardColor||saved.board,savedStone=saved.stoneStyle||saved.stone;if(BOARD_OPTIONS.some(o=>o.key===savedBoard))settings.board=savedBoard;if(STONE_OPTIONS.some(o=>o.key===savedStone))settings.stone=savedStone}catch(e){}
const SIZE=700,STAR_POINTS=[[3,3],[3,11],[7,7],[11,3],[11,11]];
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d"),undoButton=document.getElementById("undoButton"),feedbackOverlay=document.getElementById("feedbackOverlay"),overlayAction=document.getElementById("overlayAction"),nameOptions=document.getElementById("nameOptions");
let shapes=[],current=null,answer=[],questionCount=0,score=0,finished=false,geo={},quizMode="shape",questionDeck=[];
function t(key){return I18N[lang][key]}
function openingCode(shape){const n=String(shape.no||"").match(/\d+/)?.[0]||"";return `${shape.category==="indirect"?"I":"D"}${n}`}
function romanizedName(shape){const value=String(shape.id||shape.name);return value.charAt(0).toUpperCase()+value.slice(1)}
function displayName(shape){return lang==="en"?`${openingCode(shape)} ${romanizedName(shape)}`:shape.name}
function displayNameMarkup(shape){return lang==="en"?`<span class="opening-code">${openingCode(shape)}</span> <span class="opening-romaji">${romanizedName(shape)}</span>`:shape.name}
function saveSettings(){localStorage.setItem(LANG_KEY,lang);localStorage.setItem(THEME_KEY,theme);localStorage.setItem(SETTINGS_KEY,JSON.stringify({boardColor:settings.board,stoneStyle:settings.stone}))}
function computeGeo(){const margin=(innerWidth<=768?24:40)*(SIZE/700),step=(SIZE-margin*2)/14;geo={margin,step,originX:margin,originY:SIZE-margin,stoneR:step*.46}}
function point(x,y){return{x:geo.originX+x*geo.step,y:geo.originY-y*geo.step}}
function boardOption(){return BOARD_OPTIONS.find(o=>o.key===settings.board)||BOARD_OPTIONS[0]}
function drawBoardBase(){
  const b=boardOption(),x0=geo.originX,x1=geo.originX+14*geo.step,y0=geo.originY,y1=geo.originY-14*geo.step;
  ctx.fillStyle=document.body.classList.contains("theme-dark")?"#302d27":"#fbf8ef";ctx.fillRect(0,0,SIZE,SIZE);ctx.fillStyle=b.bg;ctx.fillRect(x0,y1,x1-x0,y0-y1);
  ctx.save();ctx.beginPath();ctx.rect(x0,y1,x1-x0,y0-y1);ctx.clip();
  if(b.key==="wood"){ctx.strokeStyle="rgba(104,61,21,.045)";ctx.lineWidth=1;for(let x=7;x<SIZE;x+=13){ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+3,SIZE*.32,x-2,SIZE*.68,x+1,SIZE);ctx.stroke()}}
  else{const shade=ctx.createRadialGradient(SIZE*.48,SIZE*.44,SIZE*.08,SIZE*.5,SIZE*.5,SIZE*.72);shade.addColorStop(0,"rgba(255,255,255,.055)");shade.addColorStop(1,"rgba(82,64,31,.055)");ctx.fillStyle=shade;ctx.fillRect(0,0,SIZE,SIZE)}ctx.restore();
  ctx.strokeStyle=b.line;ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<15;i++){const a=point(i,0),z=point(i,14);ctx.moveTo(a.x,a.y);ctx.lineTo(z.x,z.y);const c=point(0,i),d=point(14,i);ctx.moveTo(c.x,c.y);ctx.lineTo(d.x,d.y)}ctx.stroke();
  ctx.fillStyle=b.star;STAR_POINTS.forEach(([x,y])=>{const p=point(x,y);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,geo.step*.07),0,Math.PI*2);ctx.fill()});
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--board-label-color").trim()||b.label;ctx.font=`${Math.round(geo.step*.32)}px -apple-system,"Hiragino Sans","Yu Gothic",system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";
  "ABCDEFGHIJKLMNO".split("").forEach((letter,i)=>ctx.fillText(letter,geo.originX+i*geo.step,y0+geo.margin*.22));ctx.textAlign="right";ctx.textBaseline="middle";for(let i=0;i<15;i++)ctx.fillText(String(i+1),x0-geo.margin*.28,geo.originY-i*geo.step);
}
function stoneFill(p,r,isBlack){if(settings.stone==="flat")return isBlack?"#20201e":"#fff";const g=ctx.createRadialGradient(p.x-r*.36,p.y-r*.42,r*.06,p.x,p.y,r*1.04);if(isBlack){g.addColorStop(0,"#4e4941");g.addColorStop(.35,"#312e29");g.addColorStop(.75,"#201d19");g.addColorStop(1,"#14110d")}else{g.addColorStop(0,"#fff");g.addColorStop(.45,"#faf6ec");g.addColorStop(.85,"#eee4d0");g.addColorStop(1,"#dccfb6")}return g}
function drawStone(move){
  const p=point(move.x,move.y),r=geo.stoneR,isBlack=move.color==="black";ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=stoneFill(p,r,isBlack);
  if(settings.stone==="flat"){ctx.fill();ctx.strokeStyle="#333";ctx.lineWidth=1;ctx.stroke()}else{ctx.save();ctx.shadowColor="rgba(38,24,10,.32)";ctx.shadowBlur=r*.45*(devicePixelRatio||1);ctx.shadowOffsetY=r*.16*(devicePixelRatio||1);ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(p.x,p.y,r-.25,0,Math.PI*2);ctx.strokeStyle=isBlack?"rgba(0,0,0,.2)":"rgba(74,54,34,.28)";ctx.lineWidth=Math.max(.5,r*.03);ctx.stroke()}
  ctx.fillStyle=isBlack?"rgba(255,255,255,.92)":"rgba(30,30,28,.85)";ctx.font=`600 ${Math.round(r*.82)}px -apple-system,"Hiragino Sans","Yu Gothic",system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(move.n,p.x,p.y+r*.05);
}
function drawBoard(){computeGeo();drawBoardBase();const moves=quizMode==="name"&&current?current.baseMoves.filter(m=>m.n<=3):[{x:7,y:7,color:"black",n:1},...answer];moves.forEach(drawStone)}
function transform(dx,dy,k){switch(k){case 0:return[dx,dy];case 1:return[-dy,dx];case 2:return[-dx,-dy];case 3:return[dy,-dx];case 4:return[-dx,dy];case 5:return[dx,-dy];case 6:return[dy,dx];default:return[-dy,-dx]}}
function isCorrect(){const target=current.baseMoves.filter(m=>m.n===2||m.n===3).sort((a,b)=>a.n-b.n);return Array.from({length:8},(_,k)=>k).some(k=>target.every((m,i)=>{const[dx,dy]=transform(m.x-7,m.y-7,k);return answer[i].x===7+dx&&answer[i].y===7+dy}))}
function applyLanguage(){
  document.documentElement.lang=lang;document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.title=`${t("title")}｜Taraguchi-10`;document.querySelector(".mode-switch").setAttribute("aria-label",lang==="ja"?"クイズモード":"Quiz mode");document.getElementById("levelSwitch").setAttribute("aria-label",lang==="ja"?"難易度":"Difficulty");[["quizNav","quiz"],["favoritesNav","favorites"],["directNav","direct"],["indirectNav","indirect"],["searchNav","search"],["settingsButton","settings"]].forEach(([id,key])=>{const el=document.getElementById(id);el.setAttribute("aria-label",t(key));el.setAttribute("title",t(key))});undoButton.setAttribute("aria-label",t("undo"));document.getElementById("quizInstruction").textContent=quizMode==="shape"?t("lead"):t("nameLead");if(current){document.getElementById("progress").textContent=t("question")(questionCount);document.getElementById("shapeName").innerHTML=quizMode==="shape"?displayNameMarkup(current):"";if(quizMode==="name"&&!finished)buildNameOptions()}
}
function applyTheme(){document.body.classList.toggle("theme-dark",theme==="dark");if(current)drawBoard()}
function shuffled(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function prepareDeck(){questionDeck=shuffled(shapes).slice(0,10)}
function hideFeedback(){feedbackOverlay.hidden=true;document.getElementById("feedbackCard").className="feedback-card"}
function showQuestionFeedback(correct){
  const symbol=document.getElementById("feedbackSymbol"),answerLabel=document.getElementById("feedbackAnswerLabel"),scoreEl=document.getElementById("feedbackScore"),stamp=document.getElementById("feedbackStamp"),message=document.getElementById("feedbackMessage"),icon=document.getElementById("overlayActionIcon"),text=document.getElementById("overlayActionText");
  if(questionCount===10){
    symbol.textContent="";symbol.className="feedback-symbol";answerLabel.textContent="";scoreEl.textContent=`${score} / 10`;message.textContent="";
    stamp.src=score>=8?"stamp/effect_8-10.png":score>=4?"stamp/effect_4-7.png":"stamp/effect_1-3.png";stamp.hidden=false;
    icon.className="ti ti-refresh";text.textContent=t("again");overlayAction.setAttribute("aria-label",t("again"));if(score>=8)document.getElementById("feedbackCard").classList.add("celebrate");
  } else {
    symbol.textContent=correct?"○":"×";symbol.className=`feedback-symbol ${correct?"correct":"wrong"}`;answerLabel.textContent=correct?t("correct"):t("incorrect");scoreEl.textContent="";stamp.hidden=true;stamp.removeAttribute("src");message.textContent="";
    icon.className="ti ti-arrow-right";text.textContent=t("next");overlayAction.setAttribute("aria-label",t("next"));
  }
  feedbackOverlay.hidden=false;
}
function completeAnswer(correct){if(finished)return;finished=true;if(correct)score++;undoButton.disabled=true;nameOptions.querySelectorAll("button").forEach(b=>b.disabled=true);showQuestionFeedback(correct)}
function buildNameOptions(){
  const distractors=shuffled(shapes.filter(s=>s!==current)).slice(0,3),choices=shuffled([current,...distractors]);nameOptions.innerHTML="";choices.forEach(shape=>{const button=document.createElement("button");button.type="button";button.className="option-btn";button.innerHTML=displayNameMarkup(shape);button.addEventListener("click",()=>{if(finished)return;const correct=shape===current;button.classList.add(correct?"correct-answer":"wrong-answer");if(!correct){const correctButton=[...nameOptions.querySelectorAll("button")].find(b=>b.textContent.trim()===displayName(current));if(correctButton)correctButton.classList.add("correct-answer")}completeAnswer(correct)});nameOptions.appendChild(button)});
}
function newQuestion(){
  current=questionDeck[questionCount];answer=[];finished=false;questionCount++;hideFeedback();document.getElementById("shapeName").innerHTML=quizMode==="shape"?displayNameMarkup(current):"";document.getElementById("progress").textContent=t("question")(questionCount);document.getElementById("quizInstruction").textContent=quizMode==="shape"?t("lead"):t("nameLead");undoButton.hidden=quizMode==="name";undoButton.disabled=true;nameOptions.hidden=quizMode!=="name";if(quizMode==="name")buildNameOptions();else nameOptions.innerHTML="";drawBoard()
}
function startQuiz(){questionCount=0;score=0;answer=[];finished=false;prepareDeck();newQuestion()}
function setQuizMode(mode){quizMode=mode;document.getElementById("shapeModeButton").classList.toggle("active",mode==="shape");document.getElementById("nameModeButton").classList.toggle("active",mode==="name");if(shapes.length)startQuiz()}
canvas.addEventListener("click",event=>{if(quizMode!=="shape"||finished||answer.length>=2)return;const rect=canvas.getBoundingClientRect(),px=(event.clientX-rect.left)*SIZE/rect.width,py=(event.clientY-rect.top)*SIZE/rect.height,x=Math.round((px-geo.originX)/geo.step),y=Math.round((geo.originY-py)/geo.step);if(x<0||x>14||y<0||y>14||(x===7&&y===7)||answer.some(m=>m.x===x&&m.y===y))return;const radius=answer.length?2:1;if(Math.max(Math.abs(x-7),Math.abs(y-7))>radius)return;answer.push({x,y,color:answer.length?"black":"white",n:answer.length+2});undoButton.disabled=false;drawBoard();if(answer.length===2)completeAnswer(isCorrect())});
undoButton.addEventListener("click",()=>{if(quizMode!=="shape"||finished||!answer.length)return;answer.pop();undoButton.disabled=!answer.length;drawBoard()});overlayAction.addEventListener("click",()=>{if(questionCount===10)startQuiz();else newQuestion()});
document.getElementById("shapeModeButton").addEventListener("click",()=>{if(quizMode!=="shape")setQuizMode("shape")});document.getElementById("nameModeButton").addEventListener("click",()=>{if(quizMode!=="name")setQuizMode("name")});
const settingsBackdrop=document.getElementById("settingsBackdrop"),settingsModal=document.getElementById("settingsModal");
function renderSettings(){const b=boardOption(),s=STONE_OPTIONS.find(o=>o.key===settings.stone),languageLabel=lang==="ja"?"日本語":"English",themeLabel=theme==="dark"?t("dark"):t("light");settingsModal.innerHTML=`<h2 id="settingsTitle">${t("settings")}</h2><div class="settings-pill-row"><button class="settings-pill" id="cycleLanguage" type="button"><i class="ti ti-language" aria-hidden="true"></i>${languageLabel}</button><button class="settings-pill" id="cycleTheme" type="button"><i class="ti ${theme==="dark"?"ti-moon":"ti-sun"}" aria-hidden="true"></i>${themeLabel}</button><button class="settings-pill" id="cycleBoard" type="button"><i class="ti ti-grid-dots" aria-hidden="true"></i>${t("board")} ${lang==="ja"?b.ja:b.en}</button><button class="settings-pill" id="cycleStone" type="button"><i class="ti ti-circle-filled" aria-hidden="true"></i>${t("stone")} ${lang==="ja"?s.ja:s.en}</button></div><div class="modal-close-row"><button id="closeSettings" type="button" aria-label="${t("close")}">×</button></div>`;document.getElementById("cycleLanguage").onclick=()=>{lang=lang==="ja"?"en":"ja";saveSettings();applyLanguage();renderSettings()};document.getElementById("cycleTheme").onclick=()=>{theme=theme==="dark"?"light":"dark";saveSettings();applyTheme();renderSettings()};document.getElementById("cycleBoard").onclick=()=>{const i=BOARD_OPTIONS.findIndex(o=>o.key===settings.board);settings.board=BOARD_OPTIONS[(i+1)%BOARD_OPTIONS.length].key;saveSettings();drawBoard();renderSettings()};document.getElementById("cycleStone").onclick=()=>{const i=STONE_OPTIONS.findIndex(o=>o.key===settings.stone);settings.stone=STONE_OPTIONS[(i+1)%STONE_OPTIONS.length].key;saveSettings();drawBoard();renderSettings()};document.getElementById("closeSettings").onclick=closeSettings}
function closeSettings(){settingsBackdrop.hidden=true}document.getElementById("settingsButton").addEventListener("click",()=>{renderSettings();settingsBackdrop.hidden=false});settingsBackdrop.addEventListener("click",e=>{if(e.target===settingsBackdrop)closeSettings()});window.addEventListener("resize",()=>{if(current)drawBoard()});
applyLanguage();applyTheme();
Promise.all(DATA_FILES.map(async file=>{const response=await fetch(file,{cache:"no-cache"});if(!response.ok)throw new Error(`${file}: HTTP ${response.status}`);return response.json()})).then(data=>{shapes=data.filter(d=>Array.isArray(d.baseMoves)&&d.baseMoves.filter(m=>m.n<=3).length===3);if(shapes.length!==26)throw new Error(`Loaded ${shapes.length}/26`);document.getElementById("loading").hidden=true;document.getElementById("quizBody").hidden=false;startQuiz()}).catch(error=>{const loading=document.getElementById("loading");loading.className="error";loading.textContent=t("loadError");console.error(error)});
</script>
</body>
